<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121213">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ДнДсловко — Гра в слова</title>
  <script>
    (function () {
      var theme = "dark";
      try {
        var savedTheme = localStorage.getItem("wordle_theme");
        if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#121213");
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg-color: #121213;
      --board-bg: #121213;
      --text-color: #ffffff;
      --secondary-text: #d0d0d0;
      --muted-text: #a0a0a5;
      --tile-border: #3a3a3c;
      --tile-active-border: #565758;
      --color-correct: #8b5cf6;
      --color-present: #b59f3b;
      --color-absent: #3a3a3c;
      --key-bg: #818384;
      --key-active: #6e7071;
      --key-text: #ffffff;
      --modal-bg: #1a1a1b;
      --modal-border: #333333;
      --modal-overlay: rgba(0, 0, 0, 0.75);
      --header-border: #272729;
      --header-hover: #272729;
      --gold: #f2c94c;
      --toast-bg: #ffffff;
      --toast-text: #121213;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-color: #ffffff;
      --board-bg: #ffffff;
      --text-color: #1a1a1b;
      --secondary-text: #3f3f46;
      --muted-text: #6b6e70;
      --tile-border: #d3d6da;
      --tile-active-border: #878a8c;
      --color-correct: #8b5cf6;
      --color-present: #c9b458;
      --color-absent: #787c7e;
      --key-bg: #d3d6da;
      --key-active: #bbbfc3;
      --key-text: #1a1a1b;
      --modal-bg: #ffffff;
      --modal-border: #d3d6da;
      --modal-overlay: rgba(0, 0, 0, 0.45);
      --header-border: #d3d6da;
      --header-hover: #e8eaed;
      --gold: #b8860b;
      --toast-bg: #1a1a1b;
      --toast-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      touch-action: manipulation;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      width: 100%;
      max-width: 500px;
      height: 50px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--header-border);
    }

    .header-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .header-group.right {
      justify-content: flex-end;
    }

    .title-area {
      font-size: clamp(1.1rem, 4.6vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    .header-btn:active {
      background-color: var(--header-hover);
    }

    .header-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .icon-moon {
      display: none;
    }

    html[data-theme="light"] .icon-sun {
      display: none;
    }

    html[data-theme="light"] .icon-moon {
      display: block;
    }

    #game-container {
      width: 100%;
      max-width: 500px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px 10px;
      gap: 8px;
    }

    #board-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
      min-height: 0;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      grid-gap: 6px;
      width: min(100%, 340px, calc(56dvh - 50px));
      aspect-ratio: 5 / 6;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-gap: 6px;
    }

    .tile {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.2rem, 4.5vmin, 2rem);
      font-weight: bold;
      text-transform: uppercase;
      border: 2px solid var(--tile-border);
      border-radius: 4px;
      background-color: transparent;
      color: var(--text-color);
      aspect-ratio: 1 / 1;
      transition: border-color 0.15s linear;
    }

    .tile[data-state="active"] {
      border-color: var(--tile-active-border);
      animation: pop 0.1s ease-in-out;
    }

    .tile[data-state="correct"],
    .tile[data-state="present"],
    .tile[data-state="absent"] {
      color: #ffffff;
    }

    .tile[data-state="correct"] {
      background-color: var(--color-correct);
      border-color: var(--color-correct);
    }

    .tile[data-state="present"] {
      background-color: var(--color-present);
      border-color: var(--color-present);
    }

    .tile[data-state="absent"] {
      background-color: var(--color-absent);
      border-color: var(--color-absent);
    }

    @keyframes pop {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .flip {
      animation: flip 0.5s ease-in forwards;
    }

    @keyframes flip {
      0% { transform: rotateX(0); }
      49% { transform: rotateX(90deg); }
      50% { transform: rotateX(90deg); }
      100% { transform: rotateX(0deg); }
    }

    .shake {
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    #keyboard {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      touch-action: manipulation;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      width: 100%;
      gap: 4px;
    }

    .key {
      flex: 1;
      height: clamp(40px, 6.2dvh, 56px);
      background-color: var(--key-bg);
      color: var(--key-text);
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: clamp(0.75rem, 3.4vw, 1.15rem);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-transform: uppercase;
      transition: background-color 0.15s, transform 0.08s;
    }

    .key:active {
      transform: scale(0.95);
      background-color: var(--key-active);
    }

    .key.wide {
      flex: 1.55;
      font-size: clamp(0.65rem, 2.7vw, 0.9rem);
      font-weight: 700;
    }

    .key[data-state="correct"],
    .key[data-state="present"],
    .key[data-state="absent"] {
      color: #ffffff;
    }

    .key[data-state="correct"] {
      background-color: var(--color-correct) !important;
    }

    .key[data-state="present"] {
      background-color: var(--color-present) !important;
    }

    .key[data-state="absent"] {
      background-color: var(--color-absent) !important;
      opacity: 0.6;
    }

    /* Modal styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transform: scale(0.9);
      transition: transform 0.25s ease;
      position: relative;
    }

    .modal-overlay.open .modal-card {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted-text);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-color);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--muted-text);
      margin-top: 4px;
      line-height: 1.2;
    }

    .result-msg {
      font-size: 1.05rem;
      margin-bottom: 18px;
      line-height: 1.4;
      font-weight: 500;
    }

    .share-btn {
      width: 100%;
      background-color: var(--color-correct);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
    }

    .share-btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .share-btn[hidden] {
      display: none;
    }

    .word-reveal {
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 2px;
    }

    .help-love {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--secondary-text);
      max-width: 300px;
      margin: 0 auto 20px;
    }

    .help-legend {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .legend-tile {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    /* Toast notification */
    #toast-container {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background-color: var(--toast-bg);
      color: var(--toast-text);
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-group">
      <button class="header-btn" id="help-btn" aria-label="Правила гри">
        <svg viewBox="0 0 24 24">
          <path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/>
        </svg>
      </button>
    </div>
    <div class="title-area">ДнДсловко</div>
    <div class="header-group right">
      <button class="header-btn" id="theme-btn" aria-label="Перемкнути тему" title="Перемкнути тему">
        <svg class="icon-sun" viewBox="0 0 24 24">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24">
          <path d="M12.3 4.9c.4-.2.6-.7.5-1.1s-.5-.7-1-.7C7.1 3.1 3.2 7.1 3.2 12c0 4.9 4 8.9 8.9 8.9 3.5 0 6.6-2.1 8-5.1.2-.4 0-.9-.4-1.1-.2-.1-.4-.2-.6-.2-.2 0-.5.1-.7.2-1.1.7-2.4 1.1-3.8 1.1-3.9 0-7-3.1-7-7 0-1.4.4-2.7 1.1-3.8.2-.2.3-.5.2-.8s-.3-.5-.6-.6c-.3-.1-.6 0-.8.2z"/>
        </svg>
      </button>
      <button class="header-btn" id="stats-btn" aria-label="Статистика">
        <svg viewBox="0 0 24 24">
          <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="game-container">
    <div id="board-wrapper">
      <div id="board"></div>
    </div>
    <div id="keyboard"></div>
  </div>

  <div id="toast-container"></div>

  <!-- Статистика Модальне Вікно -->
  <div class="modal-overlay" id="stats-modal">
    <div class="modal-card">
      <button class="modal-close" id="close-stats">&times;</button>
      <div class="modal-title">Статистика</div>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-val" id="stat-played">0</span>
          <span class="stat-label">Зіграно</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="stat-winrate">0</span>
          <span class="stat-label">% перемог</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="stat-streak">0</span>
          <span class="stat-label">Поточний стрік</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="stat-max-streak">0</span>
          <span class="stat-label">Макс. стрік</span>
        </div>
      </div>
      <div class="result-msg" id="result-message"></div>
      <button class="share-btn" id="share-btn" type="button" hidden>Поділитися</button>
    </div>
  </div>

  <!-- Правила Модальне Вікно -->
  <div class="modal-overlay" id="help-modal">
    <div class="modal-card">
      <button class="modal-close" id="close-help">&times;</button>
      <div class="modal-title">Як грати</div>
      <p class="help-love">Ти знаєш як, а чи знаєш ти що я тебе кохаю?</p>
      <div class="help-legend">
        <div class="legend-tile" style="background: var(--color-correct);">К</div>
        <div class="legend-tile" style="background: var(--color-present);">А</div>
        <div class="legend-tile" style="background: var(--color-absent);">П</div>
      </div>
    </div>

    function getUtcMidnightMs() {
      const now = new Date();
      return Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    }

    function getDayNumber() {
      return Math.floor(getUtcMidnightMs() / DAY_MS);
    }

    function getPuzzleNumber() {
      return Math.max(1, Math.floor((getUtcMidnightMs() - PUZZLE_EPOCH_MS) / DAY_MS) + 1);
    }

    function getDailyWord() {
      const index = ((getDayNumber() % TARGET_WORDS.length) + TARGET_WORDS.length) % TARGET_WORDS.length;
      return TARGET_WORDS[index];
    }

    // ---------- Тема ----------
    function getTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try {
        localStorage.setItem(THEME_KEY, theme);
      } catch (e) {}

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#121213");

      const btn = document.getElementById("theme-btn");
      if (btn) {
        const label = theme === "light" ? "Увімкнути темну тему" : "Увімкнути світлу тему";
        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);
      }
    }

    // ---------- Статистика ----------
    function getStats() {
      const data = localStorage.getItem(STATS_KEY);
      if (data) {
        try {
          const parsed = JSON.parse(data);
          return {
            played: Number(parsed.played) || 0,
            wins: Number(parsed.wins) || 0,
            currentStreak: Number(parsed.currentStreak) || 0,
            maxStreak: Number(parsed.maxStreak) || 0
          };
        } catch (e) {}
      }
      return { played: 0, wins: 0, currentStreak: 0, maxStreak: 0 };
    }

    function saveStats(stats) {
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    }

    function updateStatsUI() {
      const stats = getStats();
      const winRate = stats.played > 0 ? Math.round((stats.wins / stats.played) * 100) : 0;
      document.getElementById("stat-played").textContent = stats.played;
      document.getElementById("stat-winrate").textContent = winRate;
      document.getElementById("stat-streak").textContent = stats.currentStreak;
      document.getElementById("stat-max-streak").textContent = stats.maxStreak;
    }

    function recordResult(won) {
      if (statsRecorded) return;
      const stats = getStats();
      stats.played += 1;
      if (won) {
        stats.wins += 1;
        stats.currentStreak += 1;
        stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
      } else {
        stats.currentStreak = 0;
      }
      saveStats(stats);
      statsRecorded = true;
      updateStatsUI();
    }

    // ---------- Збереження стану гри ----------
    function saveGameState() {
      const state = {
        date: todayKey,
        guesses: guesses.slice(),
        results: results.map(function (row) { return row ? row.slice() : null; }),
        keyStates: Object.assign({}, keyStates),
        currentRow: currentRow,
        currentTile: currentTile,
        status: gameStatus,
        statsRecorded: statsRecorded
      };
      try {
        localStorage.setItem(GAME_STATE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function normalizeGuesses(raw) {
      const normalized = Array(6).fill("");
      if (!Array.isArray(raw)) return normalized;
      for (let i = 0; i < 6; i++) {
        if (typeof raw[i] !== "string") continue;
        normalized[i] = raw[i].toUpperCase().replace(/[^А-ЯІЇЄҐ]/g, "").slice(0, 5);
      }
      return normalized;
    }

    function normalizeResults(raw, loadedGuesses) {
      const normalized = Array(6).fill(null);
      if (!Array.isArray(raw)) return normalized;
      for (let i = 0; i < 6; i++) {
        const row = raw[i];
        if (!Array.isArray(row) || row.length !== 5) continue;
        if (!loadedGuesses[i] || loadedGuesses[i].length !== 5) continue;
        const isValid = row.every(function (s) {
          return s === "correct" || s === "present" || s === "absent";
        });
        if (isValid) normalized[i] = row.slice();
      }
      return normalized;
    }

    function setKeyState(map, letter, state) {
      if (!letter || !(state in KEY_PRIORITY)) return;
      if (!(letter in map) || KEY_PRIORITY[state] > KEY_PRIORITY[map[letter]]) {
        map[letter] = state;
      }
    }

    function rebuildKeyStates(loadedGuesses, loadedResults) {
      const map = {};
      for (let r = 0; r < 6; r++) {
        if (!loadedResults[r]) continue;
        for (let c = 0; c < 5; c++) {
          setKeyState(map, loadedGuesses[r][c], loadedResults[r][c]);
        }
      }
      return map;
    }

    function loadGameState() {
      const raw = localStorage.getItem(GAME_STATE_KEY);
      if (!raw) return null;
      try {
        const state = JSON.parse(raw);
        if (!state || state.date !== todayKey) return null;

        const loadedGuesses = normalizeGuesses(state.guesses);
        const loadedResults = normalizeResults(state.results, loadedGuesses);
        const completed = loadedResults.filter(Boolean).length;

        let status = (state.status === "won" || state.status === "lost") ? state.status : "playing";
        if (status === "playing") {
          const lastResult = loadedResults[completed - 1];
          if (lastResult && lastResult.every(function (s) { return s === "correct"; })) {
            status = "won";
          } else if (completed >= 6) {
            status = "lost";
          }
        }

        let row = completed;
        if (status !== "playing") row = Math.min(completed, 5);
        let tile = loadedGuesses[row] ? loadedGuesses[row].length : 0;
        if (status !== "playing") tile = 0;

        return {
          guesses: loadedGuesses,
          results: loadedResults,
          keyStates: rebuildKeyStates(loadedGuesses, loadedResults),
          currentRow: row,
          currentTile: tile,
          status: status,
          statsRecorded: state.statsRecorded === true
        };
      } catch (e) {
        return null;
      }
    }

    // ---------- Інтерфейс ----------
    function showToast(message, duration) {
      duration = duration || 1800;
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastContainer.appendChild(toast);

      requestAnimationFrame(function () {
        toast.classList.add("show");
      });

      setTimeout(function () {
        toast.classList.remove("show");
        setTimeout(function () { toast.remove(); }, 250);
      }, duration);
    }

    function initBoard() {
      boardEl.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        const row = document.createElement("div");
        row.className = "row";
        row.id = "row-" + r;
        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = "tile-" + r + "-" + c;
          row.appendChild(tile);
        }
        boardEl.appendChild(row);
      }
    }

    function initKeyboard() {
      keyboardEl.innerHTML = "";
      KEYBOARD_LAYOUT.forEach(function (rowArr) {
        const rowEl = document.createElement("div");
        rowEl.className = "keyboard-row";
        rowArr.forEach(function (keyText) {
          const btn = document.createElement("button");
          btn.className = "key";
          btn.setAttribute("data-key", keyText);
          btn.setAttribute("type", "button");

          if (keyText === "ENTER") {
            btn.classList.add("wide");
            btn.textContent = "ВВІД";
          } else if (keyText === "BACK") {
            btn.classList.add("wide");
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>';
          } else {
            btn.textContent = keyText;
          }

          btn.addEventListener("click", function () { handleInput(keyText); });
          rowEl.appendChild(btn);
        });
        keyboardEl.appendChild(rowEl);
      });
    }

    function renderBoard() {
      for (let r = 0; r < 6; r++) {
        const rowGuess = guesses[r] || "";
        for (let c = 0; c < 5; c++) {
          const tile = document.getElementById("tile-" + r + "-" + c);
          if (!tile) continue;
          tile.classList.remove("flip");
          tile.textContent = rowGuess[c] || "";
          tile.removeAttribute("data-state");

          if (results[r]) {
            tile.setAttribute("data-state", results[r][c]);
          } else if (r === currentRow && c < rowGuess.length) {
            tile.setAttribute("data-state", "active");
          }
        }
      }
    }

    function renderKeyboard() {
      document.querySelectorAll(".key").forEach(function (btn) {
        const letter = btn.getAttribute("data-key");
        const state = keyStates[letter];
        if (state) {
          btn.setAttribute("data-state", state);
        } else {
          btn.removeAttribute("data-state");
        }
      });
    }

    function renderResultMessage(won) {
      if (won) {
        const compliments = ["Розумниця", "Мяу", "Умнічка<3", "я тобой горжусь и тд", "молодєць возьмі с полкі агурєц"];
        const randCompliment = compliments[Math.floor(Math.random() * compliments.length)];
        resultMsgEl.innerHTML = '<span style="color:var(--color-correct); font-size:1.2rem; font-weight:700;">' +
          randCompliment + '</span><br>Ви вгадали слово: <span class="word-reveal">' + secretWord + '</span>';
      } else {
        resultMsgEl.innerHTML = 'спробуємо завтра совушка<br>Загадане слово: <span class="word-reveal">' +
          secretWord + '</span>';
      }
      shareBtn.hidden = getAttemptsCount() === 0;
    }

    function getAttemptsCount() {
      return results.filter(function (row) { return Array.isArray(row); }).length;
    }

    function buildEmojiGrid() {
      return results
        .filter(function (row) { return Array.isArray(row); })
        .map(function (row) {
          return row.map(function (state) {
            if (state === "correct") return "🟪";
            if (state === "present") return "🟨";
            return "⬜️";
          }).join("");
        })
        .join("\n");
    }

    function buildShareText() {
      return "ДнДсловко " + getPuzzleNumber() + " " + getAttemptsCount() + "/6\n\n" +
        buildEmojiGrid() + "\n\n#ДнДсловко";
    }

    function copyTextFallback(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.top = "-9999px";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (e) {}
      textarea.remove();
      return copied;
    }

    function shareResult() {
      if (!isGameOver || getAttemptsCount() === 0) return;

      const text = buildShareText();
      const fullText = text + "\n\n" + SHARE_URL;

      if (typeof navigator.share === "function") {
        navigator.share({
          title: "ДнДсловко",
          text: fullText
        }).catch(function (error) {
          console.log("Помилка шерингу:", error);
        });
        return;
      }

      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(fullText).then(function () {
          showToast("Результат скопійовано!");
        }).catch(function () {
          if (copyTextFallback(fullText)) {
            showToast("Результат скопійовано!");
          } else {
            showToast("Не вдалося скопіювати");
          }
        });
      } else if (copyTextFallback(fullText)) {
        showToast("Результат скопійовано!");
      } else {
        showToast("Не вдалося скопіювати");
      }
    }

    // ---------- Ігровий процес ----------
    function startFreshGame() {
      todayKey = getTodayKey();
      secretWord = getDailyWord();

      guesses = Array(6).fill("");
      results = Array(6).fill(null);
      keyStates = {};
      currentRow = 0;
      currentTile = 0;
      isGameOver = false;
      isAnimating = false;
      gameStatus = "playing";
      statsRecorded = false;

      initBoard();
      renderBoard();
      renderKeyboard();
      resultMsgEl.innerHTML = "";
      shareBtn.hidden = true;
      statsModal.classList.remove("open");
      saveGameState();
    }

    function restoreGame(state) {
      todayKey = getTodayKey();
      secretWord = getDailyWord();

      guesses = state.guesses;
      results = state.results;
      keyStates = state.keyStates;
      currentRow = state.currentRow;
      currentTile = state.currentTile;
      gameStatus = state.status;
      isGameOver = gameStatus !== "playing";
      isAnimating = false;
      statsRecorded = state.statsRecorded;

      renderBoard();
      renderKeyboard();

      if (isGameOver) {
        const won = gameStatus === "won";
        if (!statsRecorded) {
          recordResult(won);
          saveGameState();
        }
        renderResultMessage(won);
      } else {
        resultMsgEl.innerHTML = "";
        if (guesses.some(function (g) { return g.length > 0; })) {
          showToast("Гру відновлено", 1400);
        }
      }
    }

    function initGame() {
      todayKey = getTodayKey();
      secretWord = getDailyWord();
      initBoard();
      initKeyboard();

      const savedState = loadGameState();
      if (savedState) {
        restoreGame(savedState);
      } else {
        startFreshGame();
      }
      updateStatsUI();
    }

    function handleInput(key) {
      if (isGameOver || isAnimating) return;

      if (key === "ENTER" || key === "ВВІД") {
        submitGuess();
      } else if (key === "BACK" || key === "BACKSPACE") {
        deleteLetter();
      } else if (typeof key === "string" && /^[А-ЯІЇЄҐ]$/i.test(key)) {
        addLetter(key.toUpperCase());
      }
    }

    function addLetter(letter) {
      if (currentTile >= 5) return;
      guesses[currentRow] = (guesses[currentRow] || "") + letter;
      currentTile = guesses[currentRow].length;
      const tile = document.getElementById("tile-" + currentRow + "-" + (currentTile - 1));
      if (tile) {
        tile.textContent = letter;
        tile.setAttribute("data-state", "active");
      }
      saveGameState();
    }

    function deleteLetter() {
      if (currentTile <= 0) return;
      currentTile--;
      guesses[currentRow] = guesses[currentRow].slice(0, -1);
      const tile = document.getElementById("tile-" + currentRow + "-" + currentTile);
      if (tile) {
        tile.textContent = "";
        tile.removeAttribute("data-state");
        tile.classList.remove("flip");
      }
      saveGameState();
    }

    function shakeRow(rowIdx) {
      const row = document.getElementById("row-" + rowIdx);
      if (!row) return;
      row.classList.add("shake");
      setTimeout(function () { row.classList.remove("shake"); }, 500);
    }

    function evaluateGuess(guess, target) {
      const targetLetters = target.split("");
      const guessLetters = guess.split("");
      const letterStates = Array(5).fill("absent");
      const letterCounts = {};

      for (let i = 0; i < targetLetters.length; i++) {
        const l = targetLetters[i];
        letterCounts[l] = (letterCounts[l] || 0) + 1;
      }

      for (let i = 0; i < 5; i++) {
        if (guessLetters[i] === targetLetters[i]) {
          letterStates[i] = "correct";
          letterCounts[guessLetters[i]]--;
        }
      }

      for (let i = 0; i < 5; i++) {
        if (letterStates[i] !== "correct") {
          const l = guessLetters[i];
          if (letterCounts[l] > 0) {
            letterStates[i] = "present";
            letterCounts[l]--;
          }
        }
      }

      return letterStates;
    }

    function submitGuess() {
      if (isGameOver || isAnimating) return;

      const guess = guesses[currentRow] || "";
      if (guess.length < 5) {
        showToast("Замало літер");
        shakeRow(currentRow);
        return;
      }

      if (!VALID_WORDS.has(guess)) {
        showToast("Немає в словнику");
        shakeRow(currentRow);
        return;
      }

      isAnimating = true;
      const row = currentRow;
      const states = evaluateGuess(guess, secretWord);
      results[row] = states;

      for (let i = 0; i < 5; i++) {
        setKeyState(keyStates, guess[i], states[i]);
      }

      const won = guess === secretWord;
      const lost = !won && row === 5;

      if (won || lost) {
        gameStatus = won ? "won" : "lost";
        isGameOver = true;
        recordResult(won);
        renderResultMessage(won);
      }

      saveGameState();

      for (let i = 0; i < 5; i++) {
        (function (index) {
          const tile = document.getElementById("tile-" + row + "-" + index);
          setTimeout(function () {
            if (!tile) return;
            tile.classList.add("flip");
            setTimeout(function () {
              tile.setAttribute("data-state", states[index]);
              renderKeyboard();
            }, 250);
          }, index * 200);
        })(i);
      }

      setTimeout(function () {
        isAnimating = false;
        if (won || lost) {
          saveGameState();
          setTimeout(function () {
            updateStatsUI();
            statsModal.classList.add("open");
          }, 500);
        } else {
          currentRow = row + 1;
          currentTile = 0;
          saveGameState();
        }
      }, 5 * 200 + 300);
    }

    // ---------- Фізична клавіатура ----------
    window.addEventListener("keydown", function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "Enter") {
        e.preventDefault();
        handleInput("ENTER");
      } else if (e.key === "Backspace") {
        e.preventDefault();
        handleInput("BACK");
      } else {
        handleInput(e.key);
      }
    });

    // ---------- Модальні вікна ----------
    document.getElementById("stats-btn").addEventListener("click", function () {
      updateStatsUI();
      if (!isGameOver) {
        resultMsgEl.innerHTML = "";
        shareBtn.hidden = true;
      }
      statsModal.classList.add("open");
    });

    document.getElementById("close-stats").addEventListener("click", function () {
      statsModal.classList.remove("open");
    });

    document.getElementById("help-btn").addEventListener("click", function () {
      helpModal.classList.add("open");
    });

    document.getElementById("close-help").addEventListener("click", function () {
      helpModal.classList.remove("open");
    });

    document.getElementById("theme-btn").addEventListener("click", function () {
      applyTheme(getTheme() === "light" ? "dark" : "light");
    });

    shareBtn.addEventListener("click", shareResult);

    [statsModal, helpModal].forEach(function (modal) {
      modal.addEventListener("click", function (e) {
        if (e.target === modal) modal.classList.remove("open");
      });
    });

    // Перевірка зміни дня, якщо вкладка була відкрита довго
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible") return;
      if (getTodayKey() !== todayKey && !isAnimating) {
        initGame();
      }
    });

    // Старт гри
    applyTheme(getTheme());
    initGame();

  </script>
</body>
</html>
